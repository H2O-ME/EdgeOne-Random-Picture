<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="420" viewBox="0 0 1200 420"
     role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">EdgeOne Random Picture</title>
  <desc id="hero-desc">基于 EdgeOne Pages 的随机图片 API 分发系统，智能识别设备类型，精准推送适配图片</desc>

  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#171717"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" rx="24" fill="url(#bg-grad)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="0.5" fill="none">
    <line x1="0" y1="84" x2="1200" y2="84"/>
    <line x1="0" y1="168" x2="1200" y2="168"/>
    <line x1="0" y1="252" x2="1200" y2="252"/>
    <line x1="0" y1="336" x2="1200" y2="336"/>
    <line x1="200" y1="0" x2="200" y2="420"/>
    <line x1="400" y1="0" x2="400" y2="420"/>
    <line x1="600" y1="0" x2="600" y2="420"/>
    <line x1="800" y1="0" x2="800" y2="420"/>
    <line x1="1000" y1="0" x2="1000" y2="420"/>
  </g>

  <!-- ═══════════ Left: Title Block ═══════════ -->
  <g id="title-block" transform="translate(64 52)">
    <!-- Category -->
    <text font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif"
          font-size="13" font-weight="600" letter-spacing="3" fill="#737373">RANDOM IMAGE API · EDGEONE PAGES</text>

    <!-- Project Name -->
    <text y="56" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif"
          font-size="46" font-weight="700" fill="#fafafa" letter-spacing="-0.5">EdgeOne</text>
    <text y="108" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif"
          font-size="46" font-weight="200" fill="#fafafa" letter-spacing="2">Random Picture</text>

    <!-- Description -->
    <text y="156" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif"
          font-size="15" fill="#a3a3a3" letter-spacing="0.3">智能设备识别 · 全球边缘分发 · 零配置图片 API</text>

    <!-- API Endpoint -->
    <g transform="translate(0 184)">
      <rect width="330" height="42" rx="8" fill="#262626" stroke="#404040" stroke-width="1"/>
      <circle cx="22" cy="21" r="4" fill="#22c55e"/>
      <text x="40" y="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="13" fill="#e5e5e5">GET /api/random?type=[pc|mobile]</text>
    </g>

    <!-- Stats (moved down with clear gap from API box) -->
    <g transform="translate(0 272)">
      <text font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="30" font-weight="700" fill="#fafafa">264</text>
      <text x="58" y="0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif"
            font-size="12" fill="#737373">张图片</text>

      <text x="140" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="30" font-weight="700" fill="#fafafa">302</text>
      <text x="198" y="0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif"
            font-size="12" fill="#737373">重定向</text>

      <text x="280" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="30" font-weight="700" fill="#fafafa">&lt;50ms</text>
      <text x="370" y="0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif"
            font-size="12" fill="#737373">边缘响应</text>
    </g>

    <!-- Bottom accent line -->
    <rect y="310" width="100" height="2" rx="1" fill="#404040"/>
  </g>

  <!-- ═══════════ Right: Flow Diagram ═══════════ -->
  <g id="flow-diagram" transform="translate(620 40)">

    <!-- Request node -->
    <g transform="translate(170 0)">
      <rect width="200" height="46" rx="10" fill="#1a1a1a" stroke="#525252" stroke-width="1.5"/>
      <text x="100" y="28" text-anchor="middle"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="14" fill="#e5e5e5">GET /api/random</text>
    </g>

    <!-- Arrow down -->
    <line x1="270" y1="46" x2="270" y2="82" stroke="#525252" stroke-width="1.5" stroke-dasharray="4 3"/>
    <polygon points="265,80 275,80 270,88" fill="#525252"/>

    <!-- UA Detection -->
    <g transform="translate(140 92)">
      <rect width="260" height="46" rx="10" fill="#1a1a1a" stroke="#737373" stroke-width="1.5"/>
      <text x="130" y="28" text-anchor="middle"
            font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif"
            font-size="14" fill="#d4d4d4">User-Agent 智能识别</text>
    </g>

    <!-- Branch arrows (start from UA box bottom y=138, end at card top y=192) -->
    <line x1="210" y1="138" x2="130" y2="188" stroke="#525252" stroke-width="1.5" stroke-dasharray="4 3"/>
    <line x1="330" y1="138" x2="410" y2="188" stroke="#525252" stroke-width="1.5" stroke-dasharray="4 3"/>

    <!-- PC branch label -->
    <text x="145" y="170" text-anchor="middle"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="11" fill="#737373">?type=pc</text>

    <!-- Mobile branch label -->
    <text x="395" y="170" text-anchor="middle"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="11" fill="#737373">?type=mobile</text>

    <!-- PC Image Cards -->
    <g transform="translate(30 192)">
      <rect width="190" height="116" rx="12" fill="#1a1a1a" stroke="#404040" stroke-width="1"/>
      <!-- Landscape thumbnails -->
      <g transform="translate(14 14)">
        <rect width="76" height="42" rx="4" fill="#262626"/>
        <rect x="4" y="4" width="68" height="34" rx="2" fill="#3f3f46"/>
        <rect x="88" y="0" width="76" height="42" rx="4" fill="#262626"/>
        <rect x="92" y="4" width="68" height="34" rx="2" fill="#52525b"/>
        <rect x="0" y="54" width="76" height="42" rx="4" fill="#262626"/>
        <rect x="4" y="58" width="68" height="34" rx="2" fill="#52525b"/>
        <rect x="88" y="54" width="76" height="42" rx="4" fill="#262626"/>
        <rect x="92" y="58" width="68" height="34" rx="2" fill="#3f3f46"/>
      </g>
      <text x="95" y="110" text-anchor="middle"
            font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif"
            font-size="11" fill="#737373">横屏 · PC 端</text>
    </g>

    <!-- Mobile Image Cards -->
    <g transform="translate(320 192)">
      <rect width="190" height="116" rx="12" fill="#1a1a1a" stroke="#404040" stroke-width="1"/>
      <!-- Portrait thumbnails -->
      <g transform="translate(14 12)">
        <rect width="34" height="56" rx="4" fill="#262626"/>
        <rect x="3" y="3" width="28" height="50" rx="2" fill="#3f3f46"/>
        <rect x="46" y="0" width="34" height="56" rx="4" fill="#262626"/>
        <rect x="49" y="3" width="28" height="50" rx="2" fill="#52525b"/>
        <rect x="92" y="0" width="34" height="56" rx="4" fill="#262626"/>
        <rect x="95" y="3" width="28" height="50" rx="2" fill="#3f3f46"/>
        <rect x="138" y="0" width="34" height="56" rx="4" fill="#262626"/>
        <rect x="141" y="3" width="28" height="50" rx="2" fill="#52525b"/>
      </g>
      <text x="95" y="110" text-anchor="middle"
            font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif"
            font-size="11" fill="#737373">竖屏 · 移动端</text>
    </g>

    <!-- 302 Redirect badge -->
    <g transform="translate(215 326)">
      <rect width="110" height="30" rx="15" fill="#166534" opacity="0.3"/>
      <rect width="110" height="30" rx="15" fill="none" stroke="#22c55e" stroke-width="1" opacity="0.6"/>
      <text x="55" y="19" text-anchor="middle"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="11" font-weight="600" fill="#4ade80">302 Redirect</text>
    </g>
  </g>
</svg>
